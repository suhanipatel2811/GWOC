services:
  # PostgreSQL Database
  - type: pserv
    name: mindsettler-db
    plan: free
    region: oregon
    databaseName: mindsettler
    databaseUser: mindsettler
    ipAllowList: []

  # Web Service
  - type: web
    name: mindsettler
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "cd Mindsettler && gunicorn Mindsettler.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: mindsettler-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: OPENAI_API_KEY
        value: ""
      - key: EMAIL_HOST_USER
        value: ""
      - key: EMAIL_HOST_PASSWORD
        value: ""
      - key: STRIPE_PUBLIC_KEY
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_PHONE_NUMBER
        value: ""
    autoDeploy: true
