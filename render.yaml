services:
  # PostgreSQL Database
  - type: pserv
    name: mindsettler-db
    env: docker
    plan: free
    region: oregon
    ipAllowList: []
    databases:
      - name: mindsettler
        user: mindsettler

  # Web Service
  - type: web
    name: mindsettler
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "cd Mindsettler && gunicorn Mindsettler.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: mindsettler-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
    autoDeploy: true
