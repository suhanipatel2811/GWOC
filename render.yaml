databases:
  - name: mindsettler-db
    databaseName: mindsettler
    user: mindsettler
    plan: free
    region: oregon
    ipAllowList: []

services:

  # Web Service
  - type: web
    name: mindsettler
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "cd Mindsettler && gunicorn Mindsettler.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: mindsettler-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: mindsettler-b9tb.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: EMAIL_HOST_USER
        sync: false  # Set this in Render dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: STRIPE_PUBLIC_KEY
        sync: false  # Set this in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false  # Set this in Render dashboard
      - key: TWILIO_ACCOUNT_SID
        sync: false  # Set this in Render dashboard
      - key: TWILIO_AUTH_TOKEN
        sync: false  # Set this in Render dashboard
      - key: TWILIO_PHONE_NUMBER
        sync: false  # Set this in Render dashboard
    autoDeploy: true
